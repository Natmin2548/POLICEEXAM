<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        const token = localStorage.getItem('authToken');
        const profile = localStorage.getItem('userProfile');
        if (!token || !profile || token.startsWith('test_dev_') || token.startsWith('dev_')) {
          localStorage.removeItem('authToken');
          localStorage.removeItem('userProfile');
          window.location.replace('/index.html');
        }
      } catch (e) {
        window.location.replace('/index.html');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ทำข้อสอบ - POLICE EXAM</title>

  <!-- Google Fonts: Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 24px 10px;
      background-color: #5A6270; /* Darker backdrop wrapper for desktop, seamless on mobile */
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0F172A;
    }

    /* Mobile Device Canvas */
    .exam-app-container {
      width: 100%;
      max-width: 430px;
      background: #FFFFFF;
      border-radius: 36px;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 22px 20px 24px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 440px) {
      body {
        background-color: #FFFFFF;
        padding: 0;
        align-items: flex-start;
      }
      .exam-app-container {
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
        padding: 16px 18px 24px 18px;
      }
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2px;
      padding-bottom: 8px;
    }

    .btn-exit {
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 700;
      color: #556272;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      padding: 4px 0;
    }

    .step-counter {
      font-size: 16.5px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.01em;
    }

    .score-counter {
      font-size: 15px;
      font-weight: 800;
      color: #C62828;
    }

    /* Thin Red Progress Line */
    .progress-track {
      width: 100%;
      height: 3.5px;
      background: #F1F5F9;
      border-radius: 999px;
      margin-bottom: 14px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #C62828;
      border-radius: 999px;
      transition: width 0.25s ease;
      width: 3.33%;
    }

    /* Badges Row */
    .badges-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .subject-pill {
      background: #FEF2F2;
      color: #C62828;
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 13px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .report-btn {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #D97706;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Question Text */
    .question-title {
      font-size: 15.5px;
      font-weight: 500;
      line-height: 1.68;
      color: #1E293B;
      letter-spacing: -0.01em;
      margin: 0 0 16px 0;
      word-break: break-word;
    }

    .question-title strong,
    .question-title b {
      font-weight: 700;
      color: #0F172A;
    }

    .question-passage-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-left: 4px solid #3B82F6;
      border-radius: 12px;
      padding: 12px 16px;
      margin: 8px 0 14px 0;
      font-size: 14.5px;
      font-weight: 400;
      color: #334155;
      line-height: 1.75;
      letter-spacing: 0.01em;
    }

    .question-intro-lead {
      font-size: 13.5px;
      font-weight: 600;
      color: #64748B;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .question-prompt-text {
      font-size: 15.5px;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.55;
      margin-top: 6px;
    }

    /* Choices List */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 16px;
    }

    .choice-item {
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #556272;
      line-height: 1.45;
      transition: all 0.15s ease;
      outline: none;
    }

    .choice-item:active {
      transform: scale(0.99);
    }

    .choice-badge {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: #F1F5F9;
      color: #94A3B8;
      font-weight: 700;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .choice-item.selected {
      border: 2px solid #C62828;
      background: #FEF2F2;
      color: #991B1B;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(198, 40, 40, 0.08);
    }

    .choice-item.selected .choice-badge {
      background: #C62828;
      color: #FFFFFF;
      font-weight: 800;
    }

    /* Review Mode Styles */
    .choice-item.correct {
      border: 2px solid #059669;
      background: #ECFDF5;
      color: #065F46;
      font-weight: 700;
    }

    .choice-item.correct .choice-badge {
      background: #059669;
      color: #FFFFFF;
      font-weight: 800;
    }

    .choice-item.wrong {
      border: 2px solid #DC2626;
      background: #FEF2F2;
      color: #991B1B;
      font-weight: 700;
    }

    .choice-item.wrong .choice-badge {
      background: #DC2626;
      color: #FFFFFF;
      font-weight: 800;
    }

    .choice-item.dimmed {
      opacity: 0.55;
      border-color: #E2E8F0;
    }

    /* Big Red Action Button */
    .btn-action-main {
      width: 100%;
      background: #C62828;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(198, 40, 40, 0.25);
      margin-bottom: 14px;
      transition: all 0.15s ease;
    }

    .btn-action-main:active {
      transform: scale(0.98);
      background: #B71C1C;
    }

    /* Bottom Question Navigator Section */
    .nav-section {
      padding-top: 10px;
      border-top: 1px solid #F1F5F9;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .nav-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #556272;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-status {
      font-size: 12px;
      font-weight: 700;
      color: #C62828;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      max-height: 150px;
      overflow-y: auto;
      padding: 2px 0;
    }

    .nav-box {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1.2px solid #E2E8F0;
      background: #FFFFFF;
      color: #64748B;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
    }

    .nav-box.current {
      border: 1.8px solid #C62828;
      color: #C62828;
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(198, 40, 40, 0.15);
    }

    .nav-box.answered {
      background: #EFF6FF;
      border-color: #BFDBFE;
      color: #1D4ED8;
    }

    .nav-box.review-correct {
      background: #ECFDF5;
      border-color: #10B981;
      color: #059669;
    }

    .nav-box.review-wrong {
      background: #FEF2F2;
      border-color: #EF4444;
      color: #DC2626;
    }

    /* Explanation Box */
    .explanation-card {
      margin-bottom: 20px;
      background: #FFFBEB;
      border: 1.5px solid #FDE68A;
      border-radius: 18px;
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.65;
      color: #78350F;
    }

    .explanation-title {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Modal Overlay for Report and Result */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
  </style>
</head>

<body>

  <div class="exam-app-container">

    <!-- Top Bar: [← ออก]  [⏱ 02:30:00]  [1 / 30]  [0 ถูก] -->
    <div class="top-bar">
      <button type="button" class="btn-exit" onclick="handleExitExam()">
        <span style="font-size: 17px; line-height: 1;">←</span>
        <span>ออก</span>
      </button>

      <!-- Pretest 150 Countdown Timer (2h 30m) -->
      <div id="examTimerBox" style="display: none; align-items: center; gap: 5px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 700; color: #0F172A; font-variant-numeric: tabular-nums;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#BD1B0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px; flex-shrink: 0;">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span id="examTimerText">02:30:00</span>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <div id="stepText" class="step-counter">
          1 / 30
        </div>

        <div id="scoreText" class="score-counter">
          0 ถูก
        </div>
      </div>
    </div>

    <!-- Thin Red Progress Bar -->
    <div class="progress-track">
      <div id="progressBar" class="progress-fill"></div>
    </div>

    <!-- Subject Pill & Report Row -->
    <div class="badges-row">
      <div id="subjectBadge" class="subject-pill">
        ภาษาไทย
      </div>

      <button type="button" class="report-btn" onclick="openReportModal()">
        <span>🚩</span>
        <span>แจ้งข้อผิด</span>
      </button>
    </div>

    <!-- Question Title -->
    <h1 id="questionText" class="question-title">
      กำลังดาวน์โหลดข้อสอบ...
    </h1>

    <!-- Choices Container -->
    <div id="choicesContainer" class="choices-container">
      <!-- Injected via JS -->
    </div>

    <!-- Explanation (Review Mode Only) -->
    <div id="explanationBox" class="explanation-card" style="display: none;">
      <div class="explanation-title">💡 คำอธิบายเฉลยละเอียด</div>
      <div id="explanationText" class="explanation-content"></div>
    </div>

    <!-- Big Red Action Button -->
    <button id="btnMainAction" type="button" class="btn-action-main" onclick="handleMainAction()">
      <span>ข้อถัดไป →</span>
    </button>

    <!-- Bottom Question Navigator -->
    <div class="nav-section">
      <div class="nav-header">
        <div class="nav-title">
          <span>🔢</span>
          <span>ข้ามไปทำข้ออื่น:</span>
        </div>
        <div id="answeredCountLabel" class="nav-status">
          ทำแล้ว 0/30 ข้อ
        </div>
      </div>

      <div id="navGrid" class="nav-grid">
        <!-- [1] [2] [3]... -->
      </div>
    </div>

  </div>

  <!-- Report Question Modal -->
  <div id="reportModal" class="modal-overlay" style="display: none;">
    <div style="background: white; border-radius: 24px; padding: 24px 22px; max-width: 400px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.25);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #0F172A;">🚩 รายงานข้อสอบผิดพลาด</h3>
        <button onclick="closeReportModal()" style="background: #F1F5F9; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; color: #64748B;">&times;</button>
      </div>
      <p style="font-size: 13px; color: #64748B; margin-bottom: 14px;">หากพบโจทย์เฉลยผิด หรือแบบพิมพ์ตกหล่น สามารถแจ้งทีมงานเพื่อตรวจสอบได้ทันที</p>
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">ประเภทปัญหา</label>
        <select id="reportType" style="width: 100%; padding: 10px; border-radius: 12px; border: 1.5px solid #CBD5E1; font-family: inherit; font-size: 13px;">
          <option value="WRONG_ANSWER">เฉลยคำตอบไม่ถูกต้อง</option>
          <option value="TYPO_ERROR">พิมพ์ผิด / ข้อความตกหล่น</option>
          <option value="AMBIGUOUS">โจทย์กำกวม มีข้อถูกมากกว่าหนึ่งข้อ</option>
          <option value="OTHER">อื่นๆ</option>
        </select>
      </div>
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">รายละเอียดเพิ่มเติม</label>
        <textarea id="reportNote" rows="3" placeholder="ระบุเหตุผลหรือข้อความที่ถูกต้อง..." style="width: 100%; padding: 10px; border-radius: 12px; border: 1.5px solid #CBD5E1; font-family: inherit; font-size: 13px; resize: none;"></textarea>
      </div>
      <div style="display: flex; gap: 10px;">
        <button onclick="submitReport()" style="flex: 1; background: #C62828; color: white; border: none; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit;">ส่งรายงาน</button>
        <button onclick="closeReportModal()" style="flex: 1; background: #F1F5F9; color: #64748B; border: 1px solid #E2E8F0; padding: 12px; border-radius: 14px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- Results Modal -->
  <div id="resultsModal" class="modal-overlay" style="display: none;">
    <div style="background: white; border-radius: 28px; padding: 26px 22px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3);">
      <div id="resultIcon" style="font-size: 52px; margin-bottom: 10px;">🎉</div>
      <h2 id="resultTitle" style="margin: 0 0 6px 0; font-size: 20px; font-weight: 800; color: #0F172A;">บันทึกคะแนนเรียบร้อย</h2>
      <p id="resultSubtitle" style="font-size: 13px; color: #64748B; margin: 0 0 20px 0;"></p>

      <div style="background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 20px; padding: 18px; margin-bottom: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div>
          <div id="resultScore" style="font-size: 28px; font-weight: 900; color: #059669;">0/30</div>
          <div style="font-size: 12px; color: #64748B; font-weight: 600; margin-top: 2px;">คะแนนที่ได้</div>
        </div>
        <div style="border-left: 1.5px solid #E2E8F0;">
          <div id="resultPct" style="font-size: 28px; font-weight: 900; color: #059669;">0%</div>
          <div style="font-size: 12px; color: #64748B; font-weight: 600; margin-top: 2px;">คิดเป็นร้อยละ</div>
        </div>
      </div>

      <div id="resultSubjectBreakdown" style="display: none; margin-bottom: 18px; text-align: left; max-height: 200px; overflow-y: auto; background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 16px; padding: 12px 14px;"></div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button onclick="startReview()" style="width: 100%; background: #C62828; color: white; border: none; padding: 14px; border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(198, 40, 40, 0.25);">
          📖 ตรวจดูเฉลยละเอียด
        </button>
        <button onclick="exitExamToSource()" style="width: 100%; background: #F1F5F9; color: #334155; border: 1px solid #CBD5E1; padding: 13px; border-radius: 16px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit;">
          กลับสู่หน้าหลัก
        </button>
      </div>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="js/shared.js?v=52"></script>
  <script src="js/exam.js?v=53"></script>
</body>

</html>
