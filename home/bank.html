<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        const token = localStorage.getItem('authToken');
        const profile = localStorage.getItem('userProfile');
        if (!token || !profile || token.startsWith('test_dev_') || token.startsWith('dev_')) {
          localStorage.removeItem('authToken');
          localStorage.removeItem('userProfile');
          window.location.replace('/index.html');
        }
      } catch (e) {
        window.location.replace('/index.html');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>คลังข้อสอบรายบท - POLICE EXAM</title>
  
  <!-- Google Fonts: Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=53">

  <style>
    body {
      background-color: #F8FAFC;
      font-family: 'Kanit', sans-serif;
      padding-bottom: 90px;
    }
    .bank-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .subject-card-item:active, .chapter-card:active {
      transform: scale(0.99);
    }
  </style>
</head>

<body>

  <!-- Main Bank Content -->
  <main class="bank-container">

    <!-- ==========================================
           SCREEN 1: 7 Main Subject Categories
           ========================================== -->
    <div id="questionBankSubjectsList">
      <!-- Injected via renderExamBankList in bank.js -->
    </div>

    <!-- ==========================================
           SCREEN 2: Chapters List + Sub-tabs
           ========================================== -->
    <!-- ==========================================
           SCREEN 2: Chapters List (Clean Style Matching Screenshot 1)
           ========================================== -->
    <div id="questionBankChaptersList" style="display: none;">
      <!-- Header with Back Arrow and Subject Title -->
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F1F5F9;">
        <button onclick="backToBankSubjects()"
          style="background: none; border: none; font-size: 22px; cursor: pointer; color: #0F172A; line-height: 1; padding: 4px 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: inherit;" title="ย้อนกลับ">
          ←
        </button>
        <h2 id="currentSubjectChapterTitle" style="margin: 0; font-size: 22px; font-weight: 800; color: #0F172A; letter-spacing: -0.01em;">ภาษาไทย</h2>
      </div>

      <!-- Chapters Directory List (Clean minimalist rows with red number) -->
      <div id="chaptersContainer" style="display: flex; flex-direction: column;">
        <!-- Dynamically populated via renderSubjectChaptersGrid in bank.js -->
      </div>
    </div>

    <!-- ==========================================
           SCREEN 3: Exam Sets for Selected Chapter (Clean Style Matching Screenshot 1)
           ========================================== -->
    <div id="questionBankExamSetsList" style="display: none;">
      <!-- Header with Back Arrow and Chapter Title -->
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #F1F5F9;">
        <button onclick="backToChaptersList()"
          style="background: none; border: none; font-size: 22px; cursor: pointer; color: #0F172A; line-height: 1; padding: 4px 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: inherit;" title="ย้อนกลับ">
          ←
        </button>
        <div>
          <h2 id="currentExamSetsChapterTitle" style="margin: 0; font-size: 20px; font-weight: 800; color: #0F172A; letter-spacing: -0.01em;">การอ่านและการเขียน</h2>
          <span id="currentExamSetsChapterSubtitle" style="font-size: 12px; color: #94A3B8; font-weight: 500;">วิชาภาษาไทย</span>
        </div>
      </div>

      <!-- Exam Sets List (Clean rows matching Screenshot 1) -->
      <div id="examSetsContainer" style="display: flex; flex-direction: column;">
        <!-- Dynamically populated via renderExamSetsList in bank.js -->
      </div>
    </div>

  </main>

  <!-- Sticky Bottom Navigation for Mobile -->
  <nav class="bottom-nav">
    <div class="bottom-nav-container">
      <a href="index.html" class="nav-tab">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span class="tab-label">หน้าหลัก</span>
      </a>

      <a href="bank.html" class="nav-tab active">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span class="tab-label">คลัง</span>
      </a>

      <a href="index.html#community" class="nav-tab">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span class="tab-label">ชุมชน</span>
      </a>
    </div>
  </nav>

  <!-- Quiz Modal (Matching Screenshot 2 Style) -->
  <div id="subjectQuizModal" class="modal-overlay"
    style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10000; align-items: center; justify-content: center; padding: 14px;">
    <div style="background: white; border-radius: 28px; padding: 24px 20px; max-width: 440px; width: 100%; max-height: 94vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1.5px solid #F1F5F9; animation: scalePop 0.25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;">
      
      <!-- Top Bar: [← ออก]  [1 / 30]  [0 ถูก] -->
      <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px;">
        <button type="button" onclick="closeSubjectQuiz()"
          style="background: none; border: none; font-size: 14px; font-weight: 700; color: #64748B; cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: inherit; padding: 0;">
          <span style="font-size: 16px;">←</span> <span>ออก</span>
        </button>
        <div id="quizStepText" style="font-size: 15px; font-weight: 800; color: #0F172A; font-family: inherit;">
          1 / 30
        </div>
        <div id="quizScoreText" style="font-size: 14.5px; font-weight: 800; color: #C62828; font-family: inherit;">
          0 ถูก
        </div>
      </div>

      <!-- Thin Progress Bar Line -->
      <div style="width: 100%; height: 3.5px; background: #F1F5F9; margin-bottom: 18px; border-radius: 999px; overflow: hidden;">
        <div id="quizProgressBar" style="width: 0%; height: 100%; background: #C62828; border-radius: 999px; transition: width 0.3s ease;"></div>
      </div>

      <!-- Subject Capsule Pill & Report Button -->
      <div style="margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span id="quizSubjectBadge" style="background: #FEF2F2; color: #C62828; font-weight: 700; font-size: 12px; padding: 4px 12px; border-radius: 999px; display: inline-block;">
          TH ภาษาไทย
        </span>
        <button type="button" onclick="openReportCurrentQuestionModal()" title="แจ้งข้อสอบข้อนี้ผิดพลาด"
          style="background: #FFFBEB; border: 1px solid #FDE68A; color: #D97706; padding: 3px 10px; border-radius: 999px; display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;">
          <span>🚩</span> <span>แจ้งข้อผิด</span>
        </button>
      </div>

      <!-- Quiz Body Question & Choices -->
      <div id="quizBodyContent" style="flex: 1; margin-bottom: 8px;"></div>

      <!-- Big Red Action Button -->
      <button id="btnNextQuiz" onclick="nextQuizQuestion()"
        style="width: 100%; background: #C62828; color: white; border: none; padding: 15px; border-radius: 16px; font-weight: 800; font-size: 16px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(198, 40, 40, 0.25); display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; margin-bottom: 16px; transition: all 0.15s ease;">
        <span>ข้อถัดไป →</span>
      </button>

      <!-- Bottom Question Numbers Grid (1 to N) -->
      <div id="quizNavContainer" style="padding-top: 8px; border-top: 1px solid #F1F5F9;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 11.5px; font-weight: 700; color: #64748B;">🔢 ข้ามไปทำข้ออื่น:</span>
          <span id="quizAnsweredCountLabel" style="font-size: 11px; font-weight: 700; color: #C62828;">ทำแล้ว 0/30 ข้อ</span>
        </div>
        <div id="quizQuestionNavGrid" style="display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-height: 140px; overflow-y: auto; padding: 2px;"></div>
      </div>

    </div>
  </div>

  <!-- Report Question Modal -->
  <div id="reportQuestionModal" class="modal-overlay"
    style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 10001; align-items: center; justify-content: center; padding: 16px;">
    <div style="background: white; border-radius: 24px; padding: 24px 22px; max-width: 420px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid #E2E8F0;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #0F172A; display: flex; align-items: center; gap: 8px;">
          <span>🚩</span> <span>รายงานข้อสอบผิดพลาด</span>
        </h3>
        <button onclick="closeReportQuestionModal()" style="background: #F1F5F9; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; color: #64748B; cursor: pointer; font-weight: 700;">&times;</button>
      </div>
      <p style="font-size: 13px; color: #64748B; margin-bottom: 14px; line-height: 1.5;">หากพบโจทย์กำกวม คำตอบเฉลยไม่ถูกต้อง หรือแบบพิมพ์ตกหล่น สามารถแจ้งทีมงานได้ทันที</p>
      
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 6px;">ประเภทปัญหา</label>
        <select id="reportQuestionType" style="width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #CBD5E1; font-family: inherit; font-size: 13.5px; background: #FFFFFF;">
          <option value="WRONG_ANSWER">เฉลยคำตอบผิดพลาด</option>
          <option value="TYPO_ERROR">พิมพ์ผิด / ข้อความตกหล่น</option>
          <option value="AMBIGUOUS">โจทย์กำกวม มีหลายคำตอบที่ถูก</option>
          <option value="IMAGE_PROBLEM">รูปภาพประกอบไม่ชัดเจน</option>
          <option value="OTHER">อื่นๆ</option>
        </select>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 6px;">รายละเอียดเพิ่มเติม</label>
        <textarea id="reportQuestionNote" rows="3" placeholder="ระบุเหตุผลหรือข้อเสนอแนะ..." style="width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #CBD5E1; font-family: inherit; font-size: 13px; resize: none;"></textarea>
      </div>

      <div style="display: flex; gap: 10px;">
        <button onclick="submitQuestionReport()" style="flex: 1; background: #BD1B0B; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 13.5px; font-weight: 800; cursor: pointer; font-family: inherit;">
          ส่งรายงาน
        </button>
        <button onclick="closeReportQuestionModal()" style="flex: 1; background: #F1F5F9; color: #64748B; border: 1px solid #E2E8F0; padding: 12px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;">
          ยกเลิก
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/shared.js?v=50"></script>
  <script src="js/bank.js?v=51"></script>
</body>

</html>
